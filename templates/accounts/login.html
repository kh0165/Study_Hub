{% extends "auth_base.html" %}

{% block title %}Sign In — Study Hub{% endblock %}

{% block auth_content %}

<div class="auth-card">

    <h1>Welcome back</h1>

    <p class="auth-subtitle">
        Sign in to continue to Study Hub
    </p>


    {% if error %}
        <div class="alert alert-error" role="alert">
            <div class="alert-content">
                {{ error }}
            </div>
        </div>
    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label
                class="form-label"
                for="email"
            >
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="you@example.com"
                required
                autofocus
            >

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="password"
            >
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Enter your password"
                required
            >

        </div>


        <!-- Forgot Password -->

        <div style="text-align: right; margin-top: -0.5rem; margin-bottom: 1.25rem;">

            <a href="{% url 'password_reset' %}">
                Forgot your password?
            </a>

        </div>


        <div
            class="form-actions"
            style="border-top: none; padding-top: 0; margin-top: 1.25rem;"
        >

            <button
                type="submit"
                class="btn btn-primary"
                style="width: 100%;"
            >
                Sign In
            </button>

        </div>

    </form>


    <div class="auth-footer">

        Don't have an account?

        <a href="{% url 'register' %}">
            Create one
        </a>

    </div>

</div>

{% endblock %}
