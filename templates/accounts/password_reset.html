{% extends "auth_base.html" %}

{% block title %}Reset Password | Study Hub{% endblock %}

{% block auth_content %}

<div class="auth-card">

    <h1>Reset your password</h1>

    <p class="auth-subtitle">
        Enter your email and we'll send you a password reset link.
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label
                class="form-label"
                for="id_email"
            >
                Email
            </label>

            <input
                type="email"
                name="email"
                id="id_email"
                class="form-input"
                placeholder="you@example.com"
                required
                autofocus
            >

        </div>

        <button
            type="submit"
            class="btn btn-primary"
            style="width: 100%;"
        >
            Send Reset Link
        </button>

    </form>

    <div class="auth-footer">

        <a href="{% url 'login' %}">
            Back to Sign In
        </a>

    </div>

</div>

{% endblock %}
