{% extends "auth_base.html" %}

{% block title %}Check Your Email | Study Hub{% endblock %}

{% block auth_content %}

<div class="auth-card">

    <h1>Check your email</h1>

    <p class="auth-subtitle">
        If an account exists with that email,
        we sent a password reset link.
    </p>

    <div class="auth-footer">

        <a href="{% url 'login' %}">
            Back to Sign In
        </a>

    </div>

</div>

{% endblock %}
