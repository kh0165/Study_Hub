{% extends "base.html" %}

{% block title %}Edit Assignment — Study Hub{% endblock %}
{% block page_heading %}Edit Assignment{% endblock %}

{% block content %}

<a
    href="{% url 'subject_detail' assignment.subject.id %}"
    class="back-link"
>
    ← Back to {{ assignment.subject.name }}
</a>

<div class="page-header">

    <div class="page-header-text">

        <h1 class="page-title">
            Edit Assignment
        </h1>

        <p class="page-subtitle">
            Subject:
            <strong>{{ assignment.subject.name }}</strong>
        </p>

    </div>

</div>


<div class="form-card">

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label
                class="form-label"
                for="title"
            >
                Assignment Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                class="form-input"
                value="{{ assignment.title }}"
                required
            >

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="description"
            >
                Description
            </label>

            <textarea
                id="description"
                name="description"
                class="form-textarea"
                rows="5"
            >{{ assignment.description }}</textarea>

        </div>


        <div class="grid-2">

            <div class="form-group">

                <label
                    class="form-label"
                    for="due_date"
                >
                    Due Date
                </label>

                <input
                    type="date"
                    id="due_date"
                    name="due_date"
                    class="form-input"
                    value="{{ assignment.due_date|date:'Y-m-d' }}"
                >

            </div>


            <div class="form-group">

                <label
                    class="form-label"
                    for="status"
                >
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                    class="form-select"
                >

                    <option
                        value="pending"
                        {% if assignment.status == 'pending' %}selected{% endif %}
                    >
                        Pending
                    </option>

                    <option
                        value="in_progress"
                        {% if assignment.status == 'in_progress' %}selected{% endif %}
                    >
                        In Progress
                    </option>

                    <option
                        value="completed"
                        {% if assignment.status == 'completed' %}selected{% endif %}
                    >
                        Completed
                    </option>

                </select>

            </div>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

            <a
                href="{% url 'subject_detail' assignment.subject.id %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
