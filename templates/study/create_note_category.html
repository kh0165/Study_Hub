{% extends "base.html" %}

{% block title %}Add Category — Study Hub{% endblock %}
{% block page_heading %}Add Category{% endblock %}

{% block content %}

<a href="{% url 'note_categories' %}" class="back-link">
    <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to categories
</a>

<div class="page-header">
    <div class="page-header-text">
        <h1 class="page-title">Add Note Category</h1>
        <p class="page-subtitle">Create a new category for your notes.</p>
    </div>
</div>

<div class="form-card">
    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label" for="name">Category Name</label>
            <input type="text" id="name" name="name" class="form-input" maxlength="100" placeholder="Example: Lecture Notes" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Category</button>
            <a href="{% url 'note_categories' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
