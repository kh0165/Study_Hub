{% extends "base.html" %}

{% block title %}Add Course — Study Hub{% endblock %}
{% block page_heading %}Add Course{% endblock %}

{% block content %}

<a href="{% url 'subject_detail' subject.id %}" class="back-link">
    ← Back to {{ subject.name }}
</a>

<div class="page-header">
    <div class="page-header-text">
        <h1 class="page-title">Add Course</h1>

        <p class="page-subtitle">
            Subject:
            <strong>{{ subject.name }}</strong>
        </p>
    </div>
</div>

<div class="form-card">

    <form method="POST">

        {% csrf_token %}

        <!-- Course Title -->
        <div class="form-group">
            <label class="form-label" for="title">
                Course Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                class="form-input"
                placeholder="Example: Complete Web Development Bootcamp"
                required
            >
        </div>

        <!-- Platform -->
        <div class="form-group">
            <label class="form-label" for="platform">
                Platform
            </label>

            <input
                type="text"
                id="platform"
                name="platform"
                class="form-input"
                placeholder="Example: Udemy"
            >
        </div>

        <!-- Instructor -->
        <div class="form-group">
            <label class="form-label" for="instructor">
                Instructor
            </label>

            <input
                type="text"
                id="instructor"
                name="instructor"
                class="form-input"
                placeholder="Example: Angela Yu"
            >
        </div>

        <!-- Progress + Status -->
        <div class="grid-2">

            <div class="form-group">
                <label class="form-label" for="progress">
                    Progress (%)
                </label>

                <input
                    type="number"
                    id="progress"
                    name="progress"
                    class="form-input"
                    min="0"
                    max="100"
                    value="0"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                    class="form-select"
                >
                    <option value="not_started">
                        Not Started
                    </option>

                    <option value="in_progress">
                        In Progress
                    </option>

                    <option value="completed">
                        Completed
                    </option>
                </select>
            </div>

        </div>

        <!-- Link -->
        <div class="form-group">
            <label class="form-label" for="link">
                Course Link
            </label>

            <input
                type="url"
                id="link"
                name="link"
                class="form-input"
                placeholder="https://www.udemy.com/..."
            >
        </div>

        <!-- Description -->
        <div class="form-group">
            <label class="form-label" for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                class="form-textarea"
                rows="6"
                placeholder="Describe what this course covers..."
            ></textarea>
        </div>

        <!-- Buttons -->
        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Course
            </button>

            <a
                href="{% url 'subject_detail' subject.id %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
