{% extends "base.html" %}

{% block title %}Edit Note — Study Hub{% endblock %}
{% block page_heading %}Edit Note{% endblock %}

{% block content %}

<a href="{% url 'note_detail' note.id %}" class="back-link">
    <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to note
</a>

<div class="page-header">
    <div class="page-header-text">
        <h1 class="page-title">Edit Note</h1>
        <p class="page-subtitle">Update your note content.</p>
    </div>
</div>

<div class="form-card form-card-wide">
    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label" for="title">Note Title</label>
            <input type="text" id="title" name="title" class="form-input" value="{{ note.title }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="content">Note Content</label>
            <textarea id="content" name="content" class="form-textarea" rows="10" required>{{ note.content }}</textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="category">Category</label>
            <select id="category" name="category" class="form-select">
                <option value="">No Category</option>
                {% for category in categories %}
                    <option value="{{ category.id }}"{% if note.category and note.category.id == category.id %} selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'note_detail' note.id %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
