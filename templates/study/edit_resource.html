{% extends "base.html" %}

{% block title %}Edit Resource — Study Hub{% endblock %}
{% block page_heading %}Edit Resource{% endblock %}

{% block content %}

<a href="{% url 'resource_detail' resource.id %}" class="back-link">
    <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to resource
</a>

<div class="page-header">
    <div class="page-header-text">
        <h1 class="page-title">Edit Resource</h1>
        <p class="page-subtitle">Update resource details.</p>
    </div>
</div>

<div class="form-card">
    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label" for="title">Resource Title</label>
            <input type="text" id="title" name="title" class="form-input" value="{{ resource.title }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea id="description" name="description" class="form-textarea" rows="5">{{ resource.description }}</textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="link">Resource Link</label>
            <input type="url" id="link" name="link" class="form-input" value="{{ resource.link }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="resource_type">Resource Type</label>
            <select id="resource_type" name="resource_type" class="form-select">
                <option value="video"{% if resource.resource_type == 'video' %} selected{% endif %}>Video</option>
                <option value="article"{% if resource.resource_type == 'article' %} selected{% endif %}>Article</option>
                <option value="website"{% if resource.resource_type == 'website' %} selected{% endif %}>Website</option>
                <option value="pdf"{% if resource.resource_type == 'pdf' %} selected{% endif %}>PDF</option>
                <option value="other"{% if resource.resource_type == 'other' %} selected{% endif %}>Other</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'resource_detail' resource.id %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
