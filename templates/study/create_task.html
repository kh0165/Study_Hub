{% extends "base.html" %}

{% block title %}Add Task — Study Hub{% endblock %}
{% block page_heading %}Add Task{% endblock %}

{% block content %}

<div class="page-header">
    <div class="page-header-text">
        <h1 class="page-title">Add Task</h1>
        <p class="page-subtitle">Create a new task and connect it to a subject.</p>
    </div>
</div>

<div class="card">
    <div class="card-body">

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label" for="subject">Subject</label>

            <select id="subject" name="subject" class="form-select" required>
                <option value="">Select a subject</option>

                {% for subject in subjects %}
                    <option value="{{ subject.id }}">
                        {{ subject.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="title">Task Title</label>
            <input
                type="text"
                id="title"
                name="title"
                class="form-input"
                required
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea
                id="description"
                name="description"
                class="form-textarea"
                rows="5"
            ></textarea>
        </div>

        <div class="grid-2">

            <div class="form-group">
                <label class="form-label" for="due_date">Due Date</label>
                <input
                    type="date"
                    id="due_date"
                    name="due_date"
                    class="form-input"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="priority">Priority</label>

                <select
                    id="priority"
                    name="priority"
                    class="form-select"
                >
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Save Task
            </button>

            <a href="{% url 'task_list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>


</div>

{% endblock %}
